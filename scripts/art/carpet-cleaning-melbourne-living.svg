<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <defs>
    <pattern id="pile" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#cbbca2"/><circle cx="2" cy="2" r="1.3" fill="#bfae92"/><circle cx="6" cy="6" r="1.3" fill="#bfae92"/><circle cx="6" cy="2" r="1" fill="#d8cbb3"/><circle cx="2" cy="6" r="1" fill="#d8cbb3"/></pattern>
    <clipPath id="floor"><rect y="228" width="640" height="252"/></clipPath>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10272f" stop-opacity=".18"/><stop offset=".4" stop-color="#10272f" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="640" height="480" fill="#f3ede2"/>
