  <rect x="250" y="0" width="150" height="150" fill="#cfe6ee"/><path d="M325 0v150M250 75h150" stroke="#fff" stroke-width="6"/>
  <rect x="244" y="150" width="162" height="8" fill="#fff"/>
  <rect x="0" y="216" width="640" height="12" fill="#fff"/>
