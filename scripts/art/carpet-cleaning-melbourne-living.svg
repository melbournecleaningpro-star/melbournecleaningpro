  <rect x="-20" y="120" width="230" height="110" rx="18" fill="#0b6e69"/>
  <rect x="-20" y="170" width="250" height="66" rx="16" fill="#0e7f79"/>
  <g fill="#10272f"><rect x="20" y="236" width="8" height="18" rx="2"/><rect x="196" y="236" width="8" height="18" rx="2"/></g>
  <ellipse cx="110" cy="256" rx="120" ry="6" fill="#10272f" opacity=".12"/>
  <!-- coffee table -->
  <rect x="396" y="196" width="210" height="12" rx="3" fill="#8a6a4a"/>
  <g fill="#6f5439"><rect x="410" y="208" width="8" height="82"/><rect x="584" y="208" width="8" height="82"/></g>
  <ellipse cx="500" cy="292" rx="110" ry="6" fill="#10272f" opacity=".1"/>
