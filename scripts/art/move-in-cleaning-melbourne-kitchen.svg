<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <defs>
    <pattern id="sb" width="16" height="48" patternUnits="userSpaceOnUse"><rect width="16" height="48" fill="#fbfbf8"/><path d="M0 0v48" stroke="#e5ebe8" stroke-width="1.5"/></pattern>
    <path id="s" d="M0-10Q1.3-1.3 10 0Q1.3 1.3 0 10Q-1.3 1.3-10 0Q-1.3-1.3 0-10Z"/>
  </defs>
  <rect width="640" height="480" fill="#f6f4ef"/>
  <rect y="380" width="640" height="100" fill="#dcdcd4"/>
  <path d="M0 380h640" stroke="#cfd0c7" stroke-width="3"/>
  <!-- handleless upper cabinets -->
  <rect x="40" y="40" width="380" height="110" rx="3" fill="#e9ece8"/>
  <g stroke="#dadfdb" stroke-width="3"><path d="M135 40v110M230 40v110M325 40v110"/></g>
  <!-- rangehood slim -->
  <rect x="190" y="150" width="100" height="14" rx="2" fill="#c3cbc8"/>
