<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2e8ef"/><stop offset="1" stop-color="#f2f7f5"/></linearGradient>
    <pattern id="tile" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#f8f8f5"/><path d="M0 0h40M0 0v20" stroke="#e3e6e1" stroke-width="1.2"/></pattern>
    <clipPath id="glass"><rect x="428" y="48" width="174" height="312"/></clipPath>
    <path id="s" d="M0-10Q1.3-1.3 10 0Q1.3 1.3 0 10Q-1.3 1.3-10 0Q-1.3-1.3 0-10Z"/>
  </defs>
  <rect width="640" height="480" fill="#f5f3ee"/>
  <!-- polished concrete floor -->
  <rect y="360" width="640" height="120" fill="#d5d4cd"/>
  <path d="M0 360h640" stroke="#c4c3bb" stroke-width="3"/>
  <path d="M110 480l140-120M330 480l90-120" stroke="#fff" stroke-width="12" opacity=".35" stroke-linecap="round"/>
  <!-- tall new window / sliding door -->
  <rect x="420" y="40" width="190" height="320" fill="#10272f"/>
  <rect x="428" y="48" width="174" height="312" fill="url(#sky)"/>
  <g clip-path="url(#glass)"><ellipse cx="480" cy="360" rx="90" ry="50" fill="#a6cdb7"/><ellipse cx="580" cy="370" rx="80" ry="50" fill="#8fc1a4"/></g>
  <rect x="512" y="48" width="6" height="312" fill="#10272f"/>
  <!-- pendant lights -->
  <path d="M170 0v70M250 0v70M330 0v70" stroke="#10272f" stroke-width="2"/>
  <g fill="#f4b63f"><path d="M158 70h24l6 16h-36Z"/><path d="M238 70h24l6 16h-36Z"/><path d="M318 70h24l6 16h-36Z"/></g>
  <!-- rear kitchen wall: cabinets + tiled splashback -->
  <rect x="30" y="100" width="370" height="70" fill="#fff"/>
  <g stroke="#e6e9e5" stroke-width="3"><path d="M122 100v70M214 100v70M306 100v70"/></g>
  <rect x="30" y="170" width="370" height="70" fill="url(#tile)"/>
  <rect x="24" y="238" width="382" height="12" rx="2" fill="#10272f"/>
  <rect x="30" y="250" width="370" height="110" fill="#0b6e69"/>
  <g stroke="#08524e" stroke-width="3"><path d="M122 250v110M214 250v110M306 250v110"/></g>
  <path d="M260 238v-34a12 12 0 0 1 24 0" fill="none" stroke="#aebdba" stroke-width="5" stroke-linecap="round"/>
  <g fill="#10272f" opacity=".7"><ellipse cx="110" cy="240" rx="18" ry="3"/><ellipse cx="160" cy="240" rx="18" ry="3"/></g>
  <!-- island -->
  <rect x="120" y="296" width="260" height="14" rx="3" fill="#fbfaf6" stroke="#e3dccf" stroke-width="2"/>
  <rect x="130" y="310" width="240" height="60" fill="#fff"/>
  <g stroke="#e8ecea" stroke-width="3"><path d="M210 310v60M290 310v60"/></g>
  <!-- stools -->
  <g fill="#c9a97e"><rect x="150" y="340" width="40" height="10" rx="5"/><rect x="310" y="340" width="40" height="10" rx="5"/></g>
  <g stroke="#10272f" stroke-width="3"><path d="M160 350v40M180 350v40M320 350v40M340 350v40"/></g>
  <!-- small plant -->
  <rect x="340" y="276" width="22" height="20" rx="5" fill="#fff" stroke="#d6e3e0" stroke-width="2"/>
  <path d="M351 276c-8-12-6-24 0-30 6 6 8 18 0 30Z" fill="#3e8e6a"/>
  <g fill="#fff"><use href="#s" transform="translate(400 250) scale(1.2)"/><use href="#s" transform="translate(90 330) scale(1)"/><use href="#s" transform="translate(560 200) scale(.8)"/></g>
  <g fill="#f4b63f"><use href="#s" transform="translate(240 420) scale(.9)"/><use href="#s" transform="translate(60 80) scale(.7)"/></g>
</svg>
