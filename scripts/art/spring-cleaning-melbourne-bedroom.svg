<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4ecf2"/><stop offset="1" stop-color="#f4faf6"/></linearGradient>
    <g id="blossom"><circle r="6" fill="#f7c8d4"/><circle r="2.5" fill="#f4b63f"/></g>
  </defs>
  <rect width="640" height="480" fill="#fdfaf5"/>
  <rect y="370" width="640" height="110" fill="#e8dcc6"/>
  <!-- tall window, open, blossom tree outside -->
