  <rect x="400" y="40" width="150" height="110" rx="4" fill="#cfe6ee"/><path d="M475 40v110M400 95h150" stroke="#fff" stroke-width="5"/>
  <rect x="120" y="60" width="120" height="80" rx="3" fill="#fff"/><rect x="130" y="70" width="100" height="60" fill="#f4b63f" opacity=".75"/><circle cx="200" cy="92" r="14" fill="#0b6e69" opacity=".8"/>
  <!-- floor + rug -->
  <rect y="372" width="640" height="108" fill="#d9c6a6"/>
  <path d="M0 372h640" stroke="#c9b38f" stroke-width="3"/>
  <ellipse cx="320" cy="430" rx="250" ry="34" fill="#0b6e69" opacity=".18"/>
  <!-- sofa: back cushions -->
  <g>
    <rect x="112" y="168" width="140" height="112" rx="22" fill="url(#fab2)"/>
    <rect x="250" y="168" width="140" height="112" rx="22" fill="url(#fab2)"/>
    <rect x="388" y="168" width="140" height="112" rx="22" fill="url(#fab2)"/>
    <!-- seat base -->
    <rect x="96" y="300" width="448" height="62" rx="14" fill="url(#fab)"/>
    <!-- seat cushions -->
    <rect x="112" y="266" width="140" height="48" rx="14" fill="url(#fab)"/>
    <rect x="250" y="266" width="140" height="48" rx="14" fill="url(#fab)"/>
    <rect x="388" y="266" width="140" height="48" rx="14" fill="url(#fab)"/>
    <!-- arms -->
    <rect x="66" y="228" width="62" height="134" rx="26" fill="url(#fab)"/>
    <rect x="512" y="228" width="62" height="134" rx="26" fill="url(#fab)"/>
    <!-- seams -->
    <g stroke="#b9a582" stroke-width="1.6" stroke-dasharray="3 4" fill="none">
      <rect x="120" y="176" width="124" height="96" rx="16"/><rect x="258" y="176" width="124" height="96" rx="16"/><rect x="396" y="176" width="124" height="96" rx="16"/>
      <path d="M120 290h124M258 290h124M396 290h124"/>
    </g>
    <!-- legs -->
    <g fill="#6f5439"><rect x="110" y="360" width="10" height="18" rx="2"/><rect x="520" y="360" width="10" height="18" rx="2"/></g>
