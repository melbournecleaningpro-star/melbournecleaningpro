<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <defs>
    <pattern id="fab" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#d8c7a9"/><path d="M0 1.5h6M0 4.5h6" stroke="#cdbb9b" stroke-width="1"/><path d="M1.5 0v6M4.5 0v6" stroke="#e2d4bb" stroke-width=".8"/></pattern>
    <pattern id="fab2" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#cfbd9d"/><path d="M0 1.5h6M0 4.5h6" stroke="#c3b08e" stroke-width="1"/><path d="M1.5 0v6M4.5 0v6" stroke="#dac9ad" stroke-width=".8"/></pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#10272f" stop-opacity=".12"/></linearGradient>
  </defs>
  <rect width="640" height="480" fill="#eef2ef"/>
