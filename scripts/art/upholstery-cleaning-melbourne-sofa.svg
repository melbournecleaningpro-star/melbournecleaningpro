    <rect x="132" y="214" width="70" height="62" rx="16" fill="#f4b63f" transform="rotate(-8 167 245)"/>
    <rect x="446" y="216" width="66" height="58" rx="16" fill="#0e7f79" transform="rotate(7 479 245)"/>
  </g>
  <!-- side table + lamp -->
  <rect x="584" y="300" width="44" height="8" rx="2" fill="#8a6a4a"/><rect x="600" y="308" width="10" height="68" fill="#6f5439"/>
  <path d="M590 300l14-52h8l14 52Z" fill="#fbe3a6"/>
  <!-- plant -->
  <path d="M34 372c-10-60-2-110 20-150 18 50 12 100-20 150Z" fill="#3e8e6a"/><path d="M20 372h40l-5 30H25Z" fill="#fff" transform="translate(0 -30)"/>
