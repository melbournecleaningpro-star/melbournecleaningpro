  <ellipse cx="90" cy="400" rx="60" ry="30" fill="#6aa864"/><ellipse cx="580" cy="400" rx="70" ry="34" fill="#6aa864"/>
  <path d="M310 400h20v80h-20Z" fill="#e6dccb"/>
  <!-- tree -->
