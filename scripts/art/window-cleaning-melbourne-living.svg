<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0ef"/><stop offset="1" stop-color="#eef7f7"/></linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="g"><rect x="60" y="40" width="520" height="330"/></clipPath>
  </defs>
  <rect width="640" height="480" fill="#f6f4ef"/>
  <!-- floor-to-ceiling glazing -->
  <rect x="50" y="30" width="540" height="350" fill="#10272f"/>
  <rect x="60" y="40" width="520" height="330" fill="url(#sky)"/>
  <g clip-path="url(#g)">
    <circle cx="470" cy="100" r="28" fill="#fff" opacity=".9"/>
    <g fill="#a6cadb"><rect x="80" y="210" width="40" height="160"/><rect x="170" y="180" width="36" height="190"/><rect x="330" y="200" width="46" height="170"/><rect x="480" y="220" width="50" height="150"/></g>
    <g fill="#8db8cb"><path d="M126 370V150l16-22 16 22v220Z"/><rect x="220" y="150" width="44" height="220"/><rect x="400" y="170" width="40" height="200"/><rect x="540" y="190" width="40" height="180"/></g>
    <ellipse cx="160" cy="380" rx="140" ry="60" fill="#8fc49a"/><ellipse cx="470" cy="385" rx="160" ry="60" fill="#7fb98a"/>
    <!-- reflections -->
    <path d="M60 330 250 40h70L130 370H60Z" fill="url(#glint)"/>
    <path d="M330 370 470 40h30L360 370Z" fill="url(#glint)" opacity=".7"/>
  </g>
  <g fill="#10272f"><rect x="233" y="40" width="7" height="330"/><rect x="407" y="40" width="7" height="330"/></g>
  <!-- sill + floor -->
  <rect x="40" y="378" width="560" height="10" rx="3" fill="#fff"/>
  <rect y="388" width="640" height="92" fill="#dfd3bd"/>
  <!-- plant inside -->
  <path d="M560 470c-6-50 0-90 16-120 12 40 8 80-16 120Z" fill="#3e8e6a"/><path d="M548 466h40l-6 14h-28Z" fill="#fff"/>
  <!-- squeegee resting on sill -->
  <rect x="300" y="366" width="70" height="8" rx="3" fill="#f4b63f"/><rect x="330" y="340" width="8" height="28" rx="3" fill="#10272f"/>
</svg>
